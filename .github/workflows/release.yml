name: build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

env:
  EPUBCHECK_VERSION: '5.1.0'
  ARTIFACT: dist/carmack-plan.epub

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Install librsvg (renders the cover)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends librsvg2-bin fontconfig

      - name: Make the vendored fonts visible to fontconfig
        # rsvg resolves the cover's font through fontconfig, not through the
        # repo. Without this the runner has no Fira Code and silently falls
        # back to DejaVu Sans Mono, producing a cover that is not the design.
        run: |
          mkdir -p ~/.local/share/fonts
          cp fonts/*.ttf ~/.local/share/fonts/
          fc-cache -f
          fc-match "Fira Code"

      - name: Build
        run: python3 build_epub.py

      - name: Structural checks
        run: python3 validate_epub.py "$ARTIFACT"

      - name: epubcheck
        run: |
          curl -fsSL -o epubcheck.zip \
            "https://github.com/w3c/epubcheck/releases/download/v${EPUBCHECK_VERSION}/epubcheck-${EPUBCHECK_VERSION}.zip"
          unzip -q epubcheck.zip
          java -jar "epubcheck-${EPUBCHECK_VERSION}/epubcheck.jar" "$ARTIFACT"

      - name: Upload build
        uses: actions/upload-artifact@v7
        with:
          name: carmack-plan-epub
          path: ${{ env.ARTIFACT }}
          if-no-files-found: error

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" "$ARTIFACT" \
              --title "$GITHUB_REF_NAME" --generate-notes \
            || gh release upload "$GITHUB_REF_NAME" "$ARTIFACT" --clobber
